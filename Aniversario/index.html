<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário! ❤️</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="confetti-container"></div>

    <div class="card">
        <div class="cake-container">
            <div class="candle"><div class="flame"></div></div>
            
            <div class="layer top-layer hidden-slice"></div>
            <div class="layer middle-layer hidden-slice"></div>
            <div class="layer bottom-layer hidden-slice"></div>
        </div>
        
        <button id="play-button" class="play-btn">
            <i class="fas fa-play"></i>
        </button>

        <h1 id="birthday-text" class="Happy_Birthday"></h1>
    </div>

    <script src="JavaScript/script.js"></script>
</body>
</html>
