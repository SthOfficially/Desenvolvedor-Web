<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Animation</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="confetti-wrapper"></div>

    <div class="main-container">
        <div class="cake-box">
            <div id="layer-bottom" class="layer bottom"></div>
            <div id="layer-middle" class="layer middle"></div>
            <div id="layer-top" class="layer top"></div>
            <div id="candle" class="candle">
                <div class="flame"></div>
            </div>
        </div>

        <button id="start-btn" class="play-button">
            <i class="fas fa-play"></i>
        </button>

        <div class="message-box">
            <span id="birthday-text"></span>
        </div>
    </div>

    <script src="JavaScript/script.js"></script>
</body>
</html>
