<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Picolé de Pulga | PET HUNTER EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="background-animate"></div>

    <div id="hud">
        <div class="hud-item"><i class="fas fa-bolt"></i> CAPTURADOS: <span id="score">0</span>/6</div>
        <div class="hud-item" id="timer-box"><i class="fas fa-clock"></i> TEMPO: <span id="timer">20</span>s</div>
    </div>

    <section id="game-canvas">
        <h1 class="glitch" data-text="CAPTURA INICIADA">CAPTURA INICIADA</h1>
        <p>Os pets escaparam pelo código! Clique rápido para capturá-los.</p>
        
        <div class="pet-runner" id="pet1">🐕</div>
        <div class="pet-runner" id="pet2">🐈</div>
        <div class="pet-runner" id="pet3">🐕</div>
        <div class="pet-runner" id="pet4">🐈</div>
        <div class="pet-runner" id="pet5">🐕</div>
        <div class="pet-runner" id="pet6">🐈</div>
    </section>

    <div id="game-modal">
        <div class="modal-content">
            <h2 id="modal-title">SISTEMA REINICIADO</h2>
            <p id="modal-text">Você não foi rápido o suficiente.</p>
            <button onclick="resetGame()">RECARREGAR PROTOCOLO</button>
        </div>
    </div>

    <script src="JavaScript/script.js"></script>
</body>
</html>
