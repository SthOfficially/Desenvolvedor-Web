<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picolé de Pulga | Cloud Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div id="hud">
        <div class="hud-item"><i class="fas fa-microchip"></i> STATUS: <span id="status-text">SCANNING</span></div>
        <div class="hud-item"><i class="fas fa-cloud-showers-heavy"></i> TENTATIVAS: <span id="attempts">0</span></div>
    </div>

    <header class="title-zone">
        <h1 class="glitch" data-text="CHUVA DE DADOS">CHUVA DE DADOS</h1>
        <p class="desc">Encontre a nuvem de <b>Chuva Rosa</b> para liberar seu Bilhete Cyber.</p>
        <p class="warning">CUIDADO: Erros aumentam a velocidade do vento!</p>
    </header>

    <main id="game-container">
        </main>

    <div id="game-modal" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">ACESSO CONCEDIDO</h2>
            <p id="modal-text">Você interceptou a nuvem sortuda!</p>
            <button id="modal-button" onclick="goToServices()">RESGATAR BILHETE</button>
        </div>
    </div>

    <script src="JavaScript/script.js"></script>
</body>
</html>
