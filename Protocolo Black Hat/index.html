<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STH PROTOCOL | DICAS ATIVADAS</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="crt-overlay"></div>
    
    <div class="main-interface">
        <header class="top-bar">
            <span><i class="fas fa-user-secret"></i> AGENTE_STH</span>
            <div class="lvl-status">
                LVL: <span id="lvl-num">1</span>/20
                <div class="xp-bar"><div id="xp-fill"></div></div>
            </div>
        </header>

        <main class="terminal-container">
            <div id="terminal-output">
                <div class="line">[SISTEMA] Protocolo STH iniciado.</div>
                <div class="line yellow">[DICA] Digite <span class="white">'help'</span> para começar.</div>
            </div>
            <div class="input-line">
                <span>admin@sth:~$</span>
                <input type="text" id="cmd-input" autofocus autocomplete="off">
            </div>
        </main>
    </div>

    <div id="modal-backup" class="modal hidden">
        <div class="modal-content backup-theme">
            <h2><i class="fas fa-lock"></i> BACKUP BLOQUEADO</h2>
            <p>Selecione os pacotes para somar: <strong id="target-sum" class="gold">0</strong></p>
            <div id="number-grid" class="grid-numbers"></div>
            <div class="sum-box">SOMA ATUAL: <span id="current-sum">0</span></div>
            <button onclick="verificarSoma()" class="btn-main">LIBERAR SITE</button>
            <button onclick="resetSoma()" class="btn-sub">RESET</button>
        </div>
    </div>

    <div id="modal-final" class="modal hidden">
        <div class="modal-content final-theme">
            <h2 class="gold">NÍVEL MÁXIMO ALCANÇADO</h2>
            <p>Você superou todos os protocolos de segurança.</p>
            <div class="warning">DADOS VULNERÁVEIS DETECTADOS.</div>
            <button class="btn-portal" onclick="irParaSite()">PROTEGER MEUS DADOS AGORA</button>
        </div>
    </div>

    <script src="JavaScript/script.js"></script>
</body>
</html>
